# Copy to ${APPDATA}/cloudflared/config.yml next to the tunnel credentials JSON
# and cert.pem (created by `cloudflared tunnel login` / `tunnel create`).
# Add a DNS record for each hostname with:
#   docker exec cloudflared cloudflared tunnel route dns <TUNNEL_ID> <hostname>
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: media.example.com            # Jellyfin
    service: http://localhost:8097
  - hostname: music.example.com            # Navidrome
    service: http://localhost:4534
  - hostname: requests.example.com         # Seerr (movies & series)
    service: http://localhost:5099
  - hostname: music-requests.example.com   # Aurral (music)
    service: http://localhost:3599
  - hostname: home.example.com             # Homepage dashboard
    service: http://localhost:3006
  - hostname: books.example.com            # Calibre-Web-Automated
    service: http://localhost:8185
  - hostname: book-requests.example.com    # Shelfmark
    service: http://localhost:8186
  - service: http_status:404
